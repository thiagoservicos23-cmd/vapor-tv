name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        run: |
          ls -la
          test -f package.json || { echo "::error::package.json nao esta na raiz do repositorio."; exit 1; }
          test -f www/index.html || { echo "::error::www/index.html nao encontrado."; exit 1; }
          test -f src-tauri/Cargo.toml || { echo "::error::src-tauri/Cargo.toml nao encontrado."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK e NDK (usa o SDK ja instalado no runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          ls "${SDKM}"
          yes | "${SDKM}" --licenses > /dev/null || true
          "${SDKM}" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Gerar projeto Android
        run: npx tauri android init --ci

      - name: Permitir HTTP local
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"

      - name: Compilar APK
        run: npx tauri android build --apk --debug --target aarch64 armv7

      - uses: actions/upload-artifact@v4
        with:
          name: vapor-tv-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
