name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Gerar projeto Android
        run: npx tauri android init --ci

      - name: Permitir HTTP local (proxy 127.0.0.1) e streams http
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"
          grep -n "usesCleartextTraffic" "$M"

      - name: Compilar APK (assinado com chave debug, instala direto)
        run: npx tauri android build --apk --debug --target aarch64 armv7

      - uses: actions/upload-artifact@v4
        with:
          name: vapor-tv-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
